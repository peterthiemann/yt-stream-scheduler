<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      max-width: 44rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem;
      font: 1.0625rem/1.65 system-ui, sans-serif;
      overflow-wrap: anywhere;
    }
    h1, h2 { line-height: 1.25; }
    a { text-underline-offset: 0.18em; }
    a + a { margin-inline-start: 1rem; }
    footer { margin-top: 2.5rem; border-top: 1px solid; padding-top: 1rem; }
  </style>
</head>
<body>
  <main>{{ content }}</main>
  <footer>
    <nav aria-label="Site information">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
      <a href="{{ '/terms/' | relative_url }}">Terms of Service</a>
    </nav>
  </footer>
</body>
</html>
